name: Regional property scrape

on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Scrape mode
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - full
      counties:
        description: Comma-separated county slugs
        required: true
        default: dublin,carlow,kildare,wicklow
        type: string
      max_pages:
        description: Optional page limit per county
        required: false
        type: string

concurrency:
  group: regional-property-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PYTHONPATH: backend
      DATABASE_URL: ${{ secrets.PROPERTY_DATABASE_URL }}
      SCRAPE_START_YEAR: "2025"
      SCRAPE_COUNTIES: dublin,carlow,kildare,wicklow
      INCREMENTAL_MAX_PAGES: "20"
      FULL_MAX_PAGES: "500"
      SCRAPE_DELAY_SECONDS: "0.6"
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt
      - name: Run server-rendered sold-card scraper
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'incremental' }}"
          COUNTIES="${{ github.event.inputs.counties || 'dublin,carlow,kildare,wicklow' }}"
          MAX_PAGES="${{ github.event.inputs.max_pages }}"
          COMMAND=(python -m property_tracker.http_scraper --mode "$MODE" --counties "$COUNTIES")
          if [ -n "$MAX_PAGES" ]; then
            COMMAND+=(--max-pages "$MAX_PAGES")
          fi
          "${COMMAND[@]}"
