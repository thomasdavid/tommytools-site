name: Property backend tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/property-backend-tests.yml"
      - "render.yaml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/property-backend-tests.yml"
      - "render.yaml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: backend
          DATABASE_URL: sqlite:///./test-property-tracker.db
        shell: bash
        run: |
          set +e
          pytest -q backend/tests --tb=short > property-test-output.txt 2>&1
          STATUS=$?
          cat property-test-output.txt
          exit $STATUS
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-test-output-py${{ matrix.python-version }}
          path: property-test-output.txt
          if-no-files-found: ignore
