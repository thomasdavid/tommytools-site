services:
  - type: web
    name: tommytools-property-api
    runtime: python
    plan: free
    region: frankfurt
    autoDeployTrigger: checksPass
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn --app-dir backend property_tracker.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tommytools-property-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CORS_ORIGINS
        value: https://tommytools.dev,https://www.tommytools.dev
      - key: DEFAULT_AREAS
        value: Blackrock,Ballsbridge,Ranelagh,Killiney,Dalkey,Monkstown
      - key: SCRAPE_START_YEAR
        value: 2025

databases:
  - name: tommytools-property-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
