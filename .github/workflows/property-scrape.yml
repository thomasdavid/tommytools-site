name: Regional property scrape

on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Scrape mode
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - full
      counties:
        description: Comma-separated county slugs
        required: true
        default: dublin,carlow,kildare,wicklow
        type: string
      max_pages:
        description: Optional page limit per county
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: property-database-write
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: [self-hosted, windows, x64, property-scraper]
    timeout-minutes: 180
    env:
      PYTHONPATH: backend
      DATABASE_URL: ${{ secrets.PROPERTY_DATABASE_URL }}
      SCRAPE_START_YEAR: "2025"
      SCRAPE_COUNTIES: dublin,carlow,kildare,wicklow
      INCREMENTAL_MAX_PAGES: "5"
      FULL_MAX_PAGES: "500"
      SCRAPE_DELAY_SECONDS: "0.8"
      DETAIL_DELAY_SECONDS: "0.45"
      LOG_LEVEL: INFO
      MODE_INPUT: ${{ github.event.inputs.mode }}
      COUNTIES_INPUT: ${{ github.event.inputs.counties }}
      MAX_PAGES_INPUT: ${{ github.event.inputs.max_pages }}
    steps:
      - uses: actions/checkout@v4

      - name: Locate system Python 3.13 or 3.12
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files\Python313\python.exe",
            "C:\Program Files\Python312\python.exe",
            "C:\Python313\python.exe",
            "C:\Python312\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python313\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python312\python.exe"
          )
          $python = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $python) {
            $launcher = Get-Command py.exe -ErrorAction SilentlyContinue
            if ($launcher) {
              foreach ($selector in @("-3.13", "-3.12")) {
                $resolved = & $launcher.Source $selector -c "import sys; print(sys.executable)" 2>$null
                if ($LASTEXITCODE -eq 0 -and $resolved -and (Test-Path $resolved)) {
                  $python = $resolved
                  break
                }
              }
            }
          }
          if (-not $python) {
            $command = Get-Command python.exe -ErrorAction SilentlyContinue
            if ($command) { $python = $command.Source }
          }
          if (-not $python) {
            throw "Python 3.13 or 3.12 x64 was not found. Install it for all users, then restart the GitHub runner service."
          }
          $version = & $python -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')"
          if ($version -notin @("3.13", "3.12")) {
            throw "Python 3.13 or 3.12 is required; found $version at $python"
          }
          "PYTHON_EXE=$python" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $pythonDir = Split-Path $python
          $pythonDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          (Join-Path $pythonDir "Scripts") | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & $python --version

      - name: Install Python dependencies
        shell: pwsh
        run: |
          & $env:PYTHON_EXE -m pip install --upgrade pip
          & $env:PYTHON_EXE -m pip install -r backend/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          & $env:PYTHON_EXE -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run validated Playwright scraper
        shell: pwsh
        run: |
          $mode = if ([string]::IsNullOrWhiteSpace($env:MODE_INPUT)) { "incremental" } else { $env:MODE_INPUT }
          $counties = if ([string]::IsNullOrWhiteSpace($env:COUNTIES_INPUT)) { "dublin,carlow,kildare,wicklow" } else { $env:COUNTIES_INPUT }
          $arguments = @("-m", "property_tracker.scraper", "--mode", $mode, "--counties", $counties)
          if (-not [string]::IsNullOrWhiteSpace($env:MAX_PAGES_INPUT)) {
            $arguments += @("--max-pages", $env:MAX_PAGES_INPUT)
          }
          & $env:PYTHON_EXE @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
