name: Property backend tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/property-backend-tests.yml"
      - "render.yaml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/property-backend-tests.yml"
      - "render.yaml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: backend
          DATABASE_URL: sqlite:///./test-property-tracker.db
        run: pytest -q backend/tests
