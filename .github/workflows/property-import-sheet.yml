name: Import property Google Sheet

on:
  workflow_dispatch:

concurrency:
  group: dublin-property-database-write
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      DATABASE_URL: ${{ secrets.PROPERTY_DATABASE_URL }}
      GOOGLE_SHEET_ID: 1teB5wZq7-SiBlohTapD-etsHpJcvak3st_dZVIKUMDw
      GOOGLE_SHEET_NAME: Raw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Import Raw sheet
        run: python -m property_tracker.import_sheet
