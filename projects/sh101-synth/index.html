<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=0.5, maximum-scale=4, user-scalable=yes, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#191a17">
<title>SH-101 Vibe Synth — Tommy Tools</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:#191a17;
  color:#17202a;
}
body{
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-x pan-y pinch-zoom;
}
.bar{
  height:64px;
  background:#fff;
  border-bottom:1px solid #dfe5e8;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
}
.bar a{text-decoration:none;color:#17202a;font-weight:750}
.bar strong{font-size:14px}
.frame{
  display:block;
  width:100%;
  height:calc(100dvh - 64px);
  border:0;
  background:#191a17;
}
@media (max-width:900px), (pointer:coarse){
  html,body{
    width:100%;
    height:100%;
    min-height:100%;
    background:#191a17;
  }
  .bar{display:none}
  .frame{
    width:100vw;
    height:100dvh;
    min-width:1000px;
    border:0;
  }
}
</style>
</head>
<body>
<header class="bar"><a href="/">← Tommy Tools</a><strong>SH-101 Vibe Synth</strong></header>
<iframe
  id="synth-frame"
  class="frame"
  src="https://thomasdavid.github.io/dashboard/sh101vibe2.html"
  title="SH-101 Vibe Synth"
  allow="autoplay; fullscreen"
  allowfullscreen
></iframe>
<script>
  const frame = document.getElementById('synth-frame');
  const mobileQuery = window.matchMedia('(max-width: 900px), (pointer: coarse)');

  function setSynthSource() {
    const nextSource = mobileQuery.matches
      ? 'https://thomasdavid.github.io/dashboard/sh101-mobile.html'
      : 'https://thomasdavid.github.io/dashboard/sh101vibe2.html';

    if (frame.src !== nextSource) frame.src = nextSource;
  }

  setSynthSource();
  mobileQuery.addEventListener?.('change', setSynthSource);
</script>
</body>
</html>
