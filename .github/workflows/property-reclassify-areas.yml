name: Reclassify property areas

on:
  workflow_dispatch:

concurrency:
  group: dublin-property-database-write
  cancel-in-progress: false

jobs:
  reclassify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      DATABASE_URL: ${{ secrets.PROPERTY_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Reclassify stored areas
        run: python -m property_tracker.reclassify_areas
